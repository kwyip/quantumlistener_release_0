name: quantumlistener
x-app: &app
  build: .
  image: ${ECR_IMAGE:-quantumlistener:local}
  env_file: ${ENV_FILE:-.env.production}
  volumes: [quantumlistener-data:/var/lib/quantumlistener]
  restart: unless-stopped
services:
  backend:
    <<: *app
    expose: ["8080"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/episodes')"], interval: 30s, timeout: 5s, retries: 3}
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
  frontend:
    image: nginx:1.27-alpine
    volumes: ["./app/web/static:/usr/share/nginx/html:ro"]
    expose: ["80"]
  nginx:
    image: nginx:1.27-alpine
    depends_on: [backend, frontend]
    volumes: ["./deployment/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["80:80"]
volumes: {quantumlistener-data: {}}
