[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantumlistener"
version = "0.1.0"
description = "An autonomous, evidence-grounded weekly quantum research podcast agent"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "boto3>=1.40,<2",
  "flask>=3.1,<4",
  "pydantic>=2.11,<3",
  "strands-agents>=1.0,<2",
  "strands-agents-tools>=0.2,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.12"]
[project.scripts]
quantumlistener = "app.web.server:main"
quantumlistener-worker = "app.worker:main"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
