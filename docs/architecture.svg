<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">QuantumListener AWS architecture</title><desc id="desc">Scheduled ingestion, Strands agent orchestration with Amazon Bedrock, speech generation, storage, review, and publication pipelines.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#10283c"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".3"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#62d5ff"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#edf7ff}.title{font-size:32px;font-weight:700}.sub{font-size:15px;fill:#9ec6dc}.lane{fill:#0c1b2b;stroke:#31516a;stroke-width:1.5}.lane-title{font-size:16px;font-weight:700;letter-spacing:1px;fill:#8eb8cf}.aws{fill:#202d3d;stroke:#ff9900;stroke-width:2}.agent{fill:#102f50;stroke:#4da3ff;stroke-width:2}.data{fill:#173627;stroke:#65c887;stroke-width:2}.external{fill:#252b35;stroke:#a8b4c1;stroke-width:1.5;stroke-dasharray:6 4}.label{font-size:16px;font-weight:650}.small{font-size:13px;fill:#b8d0df}.edge{fill:none;stroke:#62d5ff;stroke-width:2;marker-end:url(#arrow)}.edge2{fill:none;stroke:#ffb84d;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style></defs><rect width="1600" height="960" fill="url(#bg)"/><text x="55" y="55" class="title">QuantumListener · AWS pipeline architecture</text><text x="55" y="82" class="sub">Event-driven ingestion → Strands multi-agent editorial workflow → Bedrock inference → reviewed audio publication</text><rect class="lane" x="40" y="110" width="1520" height="130" rx="14"/><text class="lane-title" x="60" y="140">1 · SCHEDULED INGESTION</text><rect class="lane" x="40" y="265" width="1520" height="300" rx="14"/><text class="lane-title" x="60" y="295">2 · STRANDS AGENTS ON AWS COMPUTE</text><rect class="lane" x="40" y="590" width="1520" height="155" rx="14"/><text class="lane-title" x="60" y="620">3 · SPEECH AND PERSISTENCE</text><rect class="lane" x="40" y="770" width="1520" height="145" rx="14"/><text class="lane-title" x="60" y="800">4 · REVIEWED PUBLICATION</text><g filter="url(#shadow)"><rect class="aws" x="85" y="150" width="220" height="65" rx="10"/></g><text class="label" text-anchor="middle" x="195.0" y="180">EventBridge Scheduler</text><text class="small" text-anchor="middle" x="195.0" y="202">weekly cron</text><g filter="url(#shadow)"><rect class="aws" x="380" y="150" width="210" height="65" rx="10"/></g><text class="label" text-anchor="middle" x="485.0" y="180">Amazon SQS</text><text class="small" text-anchor="middle" x="485.0" y="202">work queue</text><g filter="url(#shadow)"><rect class="aws" x="665" y="150" width="210" height="65" rx="10"/></g><text class="label" text-anchor="middle" x="770.0" y="180">Worker</text><text class="small" text-anchor="middle" x="770.0" y="202">EC2 or AgentCore</text><g filter="url(#shadow)"><rect class="aws" x="1285" y="150" width="210" height="65" rx="10"/></g><text class="label" text-anchor="middle" x="1390.0" y="180">Dead-letter queue</text><text class="small" text-anchor="middle" x="1390.0" y="202">failed runs</text><path class="edge" d="M305 182H380"/><path class="edge" d="M590 182H665"/><path class="edge dash" d="M590 200H1260Q1285 200 1285 182"/><text class="small" text-anchor="middle" x="1010" y="193">after retry limit</text><g filter="url(#shadow)"><rect class="agent" x="80" y="315" width="205" height="70" rx="10"/></g><text class="label" text-anchor="middle" x="182.5" y="345">Weekly Editor</text><text class="small" text-anchor="middle" x="182.5" y="367">Strands orchestrator</text><g filter="url(#shadow)"><rect class="agent" x="340" y="440" width="165" height="72" rx="10"/></g><text class="label" text-anchor="middle" x="422.5" y="470">arXiv Scout</text><text class="small" text-anchor="middle" x="422.5" y="492">ingest</text><g filter="url(#shadow)"><rect class="agent" x="540" y="440" width="165" height="72" rx="10"/></g><text class="label" text-anchor="middle" x="622.5" y="470">Category Editor</text><text class="small" text-anchor="middle" x="622.5" y="492">classify</text><g filter="url(#shadow)"><rect class="agent" x="740" y="440" width="165" height="72" rx="10"/></g><text class="label" text-anchor="middle" x="822.5" y="470">Paper Listener</text><text class="small" text-anchor="middle" x="822.5" y="492">summarize</text><g filter="url(#shadow)"><rect class="agent" x="940" y="440" width="165" height="72" rx="10"/></g><text class="label" text-anchor="middle" x="1022.5" y="470">Evidence Editor</text><text class="small" text-anchor="middle" x="1022.5" y="492">validate</text><g filter="url(#shadow)"><rect class="agent" x="1140" y="440" width="165" height="72" rx="10"/></g><text class="label" text-anchor="middle" x="1222.5" y="470">Podcast Writer</text><text class="small" text-anchor="middle" x="1222.5" y="492">compose</text><g filter="url(#shadow)"><rect class="agent" x="1340" y="440" width="165" height="72" rx="10"/></g><text class="label" text-anchor="middle" x="1422.5" y="470">Publisher</text><text class="small" text-anchor="middle" x="1422.5" y="492">promote</text><g filter="url(#shadow)"><rect class="aws" x="570" y="305" width="320" height="78" rx="10"/></g><text class="label" text-anchor="middle" x="730.0" y="335">Amazon Bedrock</text><text class="small" text-anchor="middle" x="730.0" y="357">foundation model · Converse API</text><g filter="url(#shadow)"><rect class="external" x="1080" y="305" width="225" height="78" rx="10"/></g><text class="label" text-anchor="middle" x="1192.5" y="335">arXiv export API</text><text class="small" text-anchor="middle" x="1192.5" y="357">metadata source</text><path class="edge" d="M875 182V280Q875 315 840 315"/><path class="edge2" d="M285 350H570"/><text class="small" text-anchor="middle" x="425" y="340">inference and tool decisions</text><path class="edge2" d="M730 383V415Q730 440 705 440"/><path class="edge" d="M182 385V420Q182 476 340 476"/><path class="edge" d="M505 476H540"/><path class="edge" d="M705 476H740"/><path class="edge" d="M905 476H940"/><path class="edge" d="M1105 476H1140"/><path class="edge" d="M1305 476H1340"/><path class="edge2" d="M422 440V408Q422 350 570 350"/><path class="edge" d="M422 440V400Q422 344 1080 344"/><text class="small" text-anchor="middle" x="995" y="335">metadata</text><g filter="url(#shadow)"><rect class="aws" x="105" y="635" width="220" height="70" rx="10"/></g><text class="label" text-anchor="middle" x="215.0" y="665">Amazon Polly</text><text class="small" text-anchor="middle" x="215.0" y="687">SSML narration</text><g filter="url(#shadow)"><rect class="agent" x="395" y="635" width="220" height="70" rx="10"/></g><text class="label" text-anchor="middle" x="505.0" y="665">FFmpeg</text><text class="small" text-anchor="middle" x="505.0" y="687">chapter assembly</text><g filter="url(#shadow)"><rect class="data" x="735" y="625" width="250" height="80" rx="10"/></g><text class="label" text-anchor="middle" x="860.0" y="655">Amazon DynamoDB</text><text class="small" text-anchor="middle" x="860.0" y="677">papers · evidence · runs · locks</text><g filter="url(#shadow)"><rect class="data" x="1100" y="625" width="210" height="80" rx="10"/></g><text class="label" text-anchor="middle" x="1205.0" y="655">S3 drafts</text><text class="small" text-anchor="middle" x="1205.0" y="677">private objects</text><path class="edge" d="M1222 512V590Q1222 635 1205 635"/><path class="edge" d="M1222 512V575Q1222 665 985 665"/><path class="edge2" d="M1222 512V575Q1222 600 215 600V635"/><path class="edge2" d="M325 670H395"/><path class="edge2" d="M615 670H1100"/><text class="small" text-anchor="middle" x="850" y="660">audio segments</text><g filter="url(#shadow)"><rect class="external" x="100" y="810" width="220" height="65" rx="10"/></g><text class="label" text-anchor="middle" x="210.0" y="840">Human reviewer</text><text class="small" text-anchor="middle" x="210.0" y="862">approve or reject</text><g filter="url(#shadow)"><rect class="agent" x="410" y="810" width="210" height="65" rx="10"/></g><text class="label" text-anchor="middle" x="515.0" y="840">Flask API</text><text class="small" text-anchor="middle" x="515.0" y="862">protected controls</text><g filter="url(#shadow)"><rect class="agent" x="725" y="805" width="240" height="75" rx="10"/></g><text class="label" text-anchor="middle" x="845.0" y="835">Atomic promotion</text><text class="small" text-anchor="middle" x="845.0" y="857">conditional pointer update</text><g filter="url(#shadow)"><rect class="data" x="1080" y="805" width="220" height="75" rx="10"/></g><text class="label" text-anchor="middle" x="1190.0" y="835">S3 publication</text><text class="small" text-anchor="middle" x="1190.0" y="857">MP3 · transcript · RSS</text><g filter="url(#shadow)"><rect class="external" x="1370" y="810" width="145" height="65" rx="10"/></g><text class="label" text-anchor="middle" x="1442.5" y="840">Web / RSS</text><text class="small" text-anchor="middle" x="1442.5" y="862">listeners</text><path class="edge" d="M320 842H410"/><path class="edge" d="M620 842H725"/><path class="edge" d="M965 842H1080"/><path class="edge" d="M1300 842H1370"/><path class="edge" d="M845 805V745"/><text class="small" text-anchor="middle" x="920" y="780">DynamoDB lock</text><path class="edge" d="M1205 705V780Q1205 805 1185 805"/><text class="small" text-anchor="middle" x="1280" y="773">approved assets</text><g filter="url(#shadow)"><rect class="aws" x="1330" y="315" width="165" height="68" rx="10"/></g><text class="label" text-anchor="middle" x="1412.5" y="345">CloudWatch</text><text class="small" text-anchor="middle" x="1412.5" y="367">logs and metrics</text><path class="edge dash" d="M1280 420Q1412 420 1412 383"/><text x="55" y="940" class="small">Orange: AWS managed service · Blue: application / Strands component · Green: persisted data · Dashed: failure or telemetry path</text></svg>