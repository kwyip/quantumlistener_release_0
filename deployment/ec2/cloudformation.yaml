AWSTemplateFormatVersion: '2010-09-09'
Description: QuantumListener EC2 host (review before creating billable resources)
Parameters:
  InstanceType: {Type: String, Default: t3.medium}
  RootVolumeGiB: {Type: Number, Default: 30}
  Architecture: {Type: String, Default: x86_64, AllowedValues: [x86_64, arm64]}
  SubnetId: {Type: AWS::EC2::Subnet::Id}
  VpcId: {Type: AWS::EC2::VPC::Id}
  AmiId: {Type: AWS::EC2::Image::Id}
Resources:
  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties: {GroupDescription: QuantumListener web ingress, VpcId: {Ref: VpcId}, SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}]}
  Host:
    Type: AWS::EC2::Instance
    Properties: {ImageId: {Ref: AmiId}, InstanceType: {Ref: InstanceType}, IamInstanceProfile: {Ref: InstanceProfile}, SubnetId: {Ref: SubnetId}, SecurityGroupIds: [{Ref: HostSecurityGroup}], BlockDeviceMappings: [{DeviceName: /dev/xvda, Ebs: {VolumeSize: {Ref: RootVolumeGiB}, VolumeType: gp3, Encrypted: true}}]}
  InstanceProfile: {Type: AWS::IAM::InstanceProfile, Properties: {Roles: [{Ref: RuntimeRole}]}}
  RuntimeRole: {Type: AWS::IAM::Role, Properties: {AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: [ec2.amazonaws.com]}, Action: ['sts:AssumeRole']}]}, ManagedPolicyArns: ['arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy']}}
